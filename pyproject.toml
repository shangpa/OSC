[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainer-report"
version = "0.1.0"
description = "A dependency-free CLI for turning issue and pull request exports into maintainer triage reports."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Maintainer Report contributors" }
]
keywords = ["open-source", "maintenance", "triage", "issues", "pull-requests"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
maintainer-report = "maintainer_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
