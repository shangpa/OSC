[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-kit"
version = "0.2.0"
description = "Dependency-free CLI tools for Codex readiness, MCP safety checks, and repo-local agent evals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Codex Kit contributors" }
]
keywords = ["codex", "agents", "mcp", "evals", "cli", "open-source"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
codex-kit = "codex_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
