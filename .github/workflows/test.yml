name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run CLI smoke checks
        run: |
          codex-kit --help
          codex-kit scan --json .
          codex-kit agents graph . --for README.md
          codex-kit mcp doctor --repo .
